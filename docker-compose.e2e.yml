# Throwaway database for the Playwright tests. Data lives in memory and is gone when the container stops.
name: form-maker-e2e

services:
  postgres:
    image: postgres:16-alpine
    container_name: form-maker-e2e-db
    environment:
      POSTGRES_USER: formmaker
      POSTGRES_PASSWORD: formmaker_e2e
      POSTGRES_DB: formmaker_e2e
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formmaker -d formmaker_e2e"]
      interval: 2s
      timeout: 3s
      retries: 20
